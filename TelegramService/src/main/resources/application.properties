spring.application.name= telegram_api_service
bot.token=${BOT_TOKEN}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

app.rabbitmq.add_cat_request_queue=add-cat-request-queue
app.rabbitmq.get_my_cats_queue=get_my_cats_queue
app.rabbitmq.my_cats_response_queue=my_cats_response_queue

file.storage.path=${FILE_STORAGE_PATH:/app/photos}
